version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: fintrack_postgres
    environment:
      POSTGRES_DB: fintrack_db
      POSTGRES_USER: fintrack_admin
      POSTGRES_PASSWORD: fintrack_secure_pass_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrack_admin -d fintrack_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fintrack-network

networks:
  fintrack-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local