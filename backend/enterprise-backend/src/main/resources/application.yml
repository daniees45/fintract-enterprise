spring:
  application:
    name: fintrack-enterprise-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/fintrack_db
    username: fintrack_admin
    password: fintrack_secure_pass_2026
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000
  
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate #Strict enterprise standard. Hibernate will NEVER modify our tables automatically
    show-sql: true
    properties:
      hibernate:
         format_sql: true
  flyway:
    baseline-on-migrate: true
    enabled: true
    locations: classpath:db/migration

